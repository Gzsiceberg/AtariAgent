[project]
name = "atariagent"
version = "0.1.0"
description = "A single-GPU, performance-oriented EfficientZero implementation for Atari 100k"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "beartype>=0.22.9",
    "einops>=0.8.2",
    "gymnasium[atari]>=1.3.0",
    "hydra-core>=1.3.4",
    "jaxtyping>=0.3.11",
    "matplotlib>=3.11.1",
    "opencv-python>=5.0.0.93",
    "pygame>=2.6.1",
    "pytest>=9.1.1",
    "rich>=15.0.0",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
wandb = [
    "wandb>=0.28.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pybind11>=3.0",
    "ruff>=0.16.3",
    "scikit-build-core>=0.11",
]

[build-system]
requires = [
    "pybind11>=3.0",
    "scikit-build-core>=0.11",
    "torch>=2.13.0",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/atariagent"]
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
