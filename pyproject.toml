[project]
name = "atariagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beartype>=0.22.9",
    "einops>=0.8.2",
    "gymnasium[atari]>=1.3.0",
    "hydra-core>=1.3.4",
    "jaxtyping>=0.3.11",
    "opencv-python>=5.0.0.93",
    "pygame>=2.6.1",
    "pytest>=9.1.1",
    "ray>=2.56.1",
    "torch>=2.13.0",
    "wandb>=0.28.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"
