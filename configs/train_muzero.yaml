defaults:
  - train_muzero_schema
  - override hydra/job_logging: disabled
  - _self_

seed: 0

environment:
  id: ALE/Alien-v5
  frame_stack: 4
  frame_skip: 4
  screen_size: 96
  max_episode_steps: 3000
  grayscale: false
  episodic_life: true

self_play:
  num_envs: 4
  total_transitions: 100000
  num_simulations: 50
  steps_per_iteration: 100
  trajectory_length: 400
  clip_rewards: true
  add_exploration_noise: true

replay:
  max_transitions: 100000
  warmup_transitions: 2000
  priority_alpha: 0.6
  priority_beta_initial: 0.4
  priority_beta_final: 1.0
  priority_epsilon: 0.000001

training:
  device: auto
  # EfficientZero's 100k collection-phase updates followed by 20k
  # learner-only updates.
  steps: 100000
  final_steps: 20000
  # Four environments collect 400 transitions per iteration on average.
  updates_per_iteration: 400
  batch_size: 256
  unroll_steps: 5
  td_steps: 5
  lstm_horizon: 5
  # Refresh replay values and policies with the delayed target network.
  use_target_network_reanalysis: true
  # Two 768-root chunks are faster here than 1024+512 and use less memory.
  policy_reanalysis_chunk_size: 768
  # Cache corrected values and MCTS policies by transition and target version.
  cache_reanalyzed_targets: true
  # Keep replay-stored value and policy targets for the first learner updates.
  reanalysis_start_step: 1000
  # Hard limit for queued native reanalysis requests.
  reanalysis_prefetch_batches: 2
  # Bound threaded sampling, reanalysis, H2D transfer, and ready GPU batches.
  batch_max_in_flight: 3
  # Keep at most two transferred GPU batches waiting ahead of the learner.
  batch_ready_prefetch: 2
  batch_worker_timeout_seconds: 600.0
  reanalysis_timeout_seconds: 600.0
  # Accept at most one target-copy interval of queued target staleness.
  reanalysis_max_weight_lag: 200
  # Cap native OpenMP tree traversal to avoid CPU oversubscription.
  reanalysis_worker_num_threads: 4
  # Hard-copy online representation/value weights for direct value reanalysis.
  target_update_interval: 200
  # Per raw frame; training and MCTS use discount ** frame_skip.
  discount: 0.997
  # EfficientZero V1 Atari optimizer and step learning-rate schedule.
  learning_rate: 0.2
  momentum: 0.9
  weight_decay: 0.0001
  lr_warmup_steps: 1000  # 1% of 100,000 collection-phase updates
  lr_decay_rate: 0.1
  lr_decay_steps: 100000
  max_gradient_norm: 5.0
  # FP32 is the deterministic baseline; BF16 is the optimized CUDA mode.
  precision: bf16  # fp32 or bf16
  deterministic: false
  # Disable these checks in production after validating with them enabled.
  runtime_type_checks: false
  # Compile the complete learner unroll/loss graph and autotune its kernels.
  compile_model: true
  compile_mode: default
  log_every: 10

# EfficientZero Atari policy, value, and value-prefix coefficients.
# Reward supervises an LSTM value prefix.
loss:
  policy_weight: 1.0
  value_weight: 0.25
  reward_weight: 1.0

checkpoint:
  path: checkpoints/Alien-v5/muzero_latest.pt
  every: 1000
  # Keep snapshots at ten evenly spaced points across the complete run.
  keep_representative: 10

evaluation:
  enabled: true
  episodes: 1
  data_path: evaluations/Alien-v5/muzero_evaluations.json
  plot_path: evaluations/Alien-v5/muzero_evaluation.png

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
