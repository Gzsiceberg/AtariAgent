defaults:
  - train_agent_schema
  - override hydra/job_logging: disabled
  - _self_

seed: 2

environment:
  id: ALE/Alien-v5
  frame_stack: 4
  frame_skip: 4
  screen_size: 96
  max_episode_steps: 3000
  grayscale: false
  episodic_life: true

self_play:
  num_envs: 4
  total_transitions: 100000
  # "gumbel" is EfficientZeroV2 top-m sequential halving; "puct" is conventional MCTS.
  search_algorithm: gumbel
  # Gumbel training derives top-m from the game's action count: 2 below 4
  # actions, 4 below 16 actions, and 8 otherwise. Below 4 actions N becomes 4.
  num_simulations: 16
  num_top_actions: 4  # Legacy/checkpoint fallback; resolved at runtime for Gumbel.
  c_visit: 50.0
  c_scale: 0.1
  steps_per_iteration: 100
  trajectory_length: 400
  clip_rewards: true
  add_exploration_noise: true

replay:
  max_transitions: 100000
  warmup_transitions: 2000
  # EfficientZero V2 Atari uses priorities directly and full IS correction.
  priority_epsilon: 0.000001

training:
  device: auto
  # EfficientZero's 100k collection-phase updates followed by 20k
  # learner-only updates.
  steps: 100000
  final_steps: 20000
  # Four environments collect 400 transitions per iteration on average.
  updates_per_iteration: 400
  batch_size: 256
  unroll_steps: 5
  td_steps: 5
  lstm_horizon: 5
  # EfficientZero V2 uses TD values early/recently and MCTS root values for
  # stale replay states after the model has become reliable.
  value_target: mixed
  mixed_value_start_step: 30000
  mixed_value_threshold: 5000
  # Refresh replay values and policies with the delayed target network.
  use_target_network_reanalysis: true
  # Two 768-root chunks are faster here than 1024+512 and use less memory.
  policy_reanalysis_chunk_size: 768
  # Cache corrected TD values, MCTS root values, and policies by target version.
  cache_reanalyzed_targets: true
  # Hard limit for queued native reanalysis requests.
  reanalysis_prefetch_batches: 2
  # Bound threaded sampling, reanalysis, H2D transfer, and ready GPU batches.
  batch_max_in_flight: 3
  # Keep at most two transferred GPU batches waiting ahead of the learner.
  batch_ready_prefetch: 2
  batch_worker_timeout_seconds: 600.0
  reanalysis_timeout_seconds: 600.0
  # Cap native OpenMP tree traversal to avoid CPU oversubscription.
  reanalysis_worker_num_threads: 4
  # Hard-copy every 200 learner updates through update 1,000, then every 1,000.
  target_update_interval: 800
  initial_target_update_interval: 200
  initial_target_update_steps: 2000
  # Per raw frame; training and MCTS use discount ** frame_skip.
  discount: 0.997
  # EfficientZero V1 Atari optimizer and step learning-rate schedule.
  learning_rate: 0.2
  momentum: 0.9
  weight_decay: 0.0001
  lr_warmup_steps: 1000  # 1% of 100,000 collection-phase updates
  lr_decay_rate: 0.1
  lr_decay_steps: 100000
  max_gradient_norm: 5.0
  # FP32 is the deterministic baseline; BF16 is the optimized CUDA mode.
  precision: bf16  # fp32 or bf16
  deterministic: false
  # Disable these checks in production after validating with them enabled.
  runtime_type_checks: false
  # Compile the complete learner unroll/loss graph and autotune its kernels.
  compile_model: true
  compile_mode: default
  log_every: 10

# Apply independent draws to the root stack and the packed sequence of
# consistency targets, matching the released EfficientZero Atari learner.
augmentation:
  enabled: true
  transforms: [shift, intensity]
  shift_delta: 4
  intensity_scale: 0.05

# EfficientZero Atari policy, value, value-prefix, and consistency settings.
# Reward supervises an LSTM value prefix. Consistency aligns each recurrent
# dynamics state with the representation of its corresponding observation.
loss:
  policy_weight: 1.0
  # EZV2 config uses 0.5, but its Value_loss applies another 0.5 when IQL is
  # disabled. Our scalar cross-entropy has no internal half, so 0.25 is equal.
  value_weight: 0.25
  reward_weight: 1.0
  consistency_enabled: true
  consistency_weight: 2.0

checkpoint:
  path: checkpoints/${environment_slug:${environment.id}}/agent_latest.pt
  # Keep snapshots at ten evenly spaced points across the complete run.
  keep_representative: 10

evaluation:
  enabled: true
  episodes: 16
  num_envs: 16
  data_path: evaluations/${environment_slug:${environment.id}}/agent_evaluations.json
  plot_path: evaluations/${environment_slug:${environment.id}}/agent_evaluation.png

wandb:
  enabled: true
  project: AtariAgent
  entity: null
  tags: []

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
