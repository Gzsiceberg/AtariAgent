defaults:
  - train_agent_schema
  - _self_
  - search: gumbel
  - override hydra/job_logging: disabled

seed: 2

environment:
  id: ALE/Asterix-v5
  frame_stack: 4
  frame_skip: 4
  screen_size: 96
  max_episode_steps: 3000
  # full_game: life losses keep the remaining time budget (historical default).
  # episodic_life: each life-loss reset starts a new budget (V2 wrapper order).
  # Without episodic_life enabled, both modes limit the full game.
  time_limit_mode: episodic_life # full_game or episodic_life
  grayscale: false
  episodic_life: true

model:
  # false: V1 raw action/action_count plane; true: learned projection + LayerNorm.
  action_embedding: true

self_play:
  num_envs: 4
  total_transitions: 100000
  c_visit: 50.0
  c_scale: 0.1
  # Four environments collect 100 transitions between actor refreshes.
  steps_per_iteration: 25
  trajectory_length: 400
  clip_rewards: true

replay:
  max_transitions: 100000
  warmup_transitions: 2000
  # By default both modes use V2 insertion: each new trajectory gets
  # max(buffer maximum, trajectory error maximum); empty buffer maximum is 1.
  # Lower bound for normalized importance weights, in [0, 1]; 0 disables clipping.
  priority_weight_clip: 0.0
  # Override insertion with V1's buffer maximum only (1 when empty).
  use_max_priority: false
  # V1 timeout targets: remaining rewards with zero continuation, not masked tails.
  # Combine with environment.time_limit_mode=full_game for V1 time-limit behavior.
  treat_truncations_as_terminal: true
  # Sample with priority**0.6 and linearly anneal the
  # importance-sampling exponent from 0.4 to 1.0 over all learner updates.
  priority_alpha: 0.6
  priority_beta_initial: 0.4
  priority_beta_final: 1.0
  priority_epsilon: 0.000001

reanalysis:
  # Refresh replay values and policies with the delayed target network.
  # Two 768-root chunks are faster here than 1024+512 and use less memory.
  policy_chunk_size: 1536
  # Cache policy/MCTS targets with a TTL and raw bootstrap values until the
  # next target-network publication.
  cache_targets: true
  # Re-search an entry once it is this many learner updates old. Zero disables
  # age-based expiration; cache clearing and target publication still refresh it.
  cache_target_ttl: 200
  # Hard limit for queued native reanalysis requests.
  prefetch_batches: 2
  timeout_seconds: 600.0
  # Cap native OpenMP tree traversal to avoid CPU oversubscription.
  worker_num_threads: 4
  # Keep delayed-target hard copies on a fixed learner-update interval.
  target_update_interval: 400

training:
  device: auto
  # EfficientZero's 100k collection-phase updates followed by 20k
  # learner-only updates.
  steps: 100000
  final_steps: 20000
  # PUCT temperature schedule horizon: collect_steps or total_steps (includes final steps).
  visit_softmax_temperature_horizon: collect_steps
  # Match EfficientZero's 100-update self-play model refresh cadence while
  # keeping learner progress proportional to collected transitions.
  updates_per_iteration: 100
  batch_size: 256
  unroll_steps: 5
  td_steps: 5
  lstm_horizon: 5
  # EfficientZero V2 uses TD values early/recently and MCTS root values for
  # stale replay states after the model has become reliable.
  value_target: mixed
  mixed_value_start_step: 30000
  mixed_value_threshold: 20000
  # Learner-only updates preserve replay freshness for mixed value targets.
  # Bound threaded sampling, reanalysis, H2D transfer, and ready GPU batches.
  batch_max_in_flight: 3
  # Keep at most two transferred GPU batches waiting ahead of the learner.
  batch_ready_prefetch: 2
  batch_worker_timeout_seconds: 600.0
  # Per raw frame; training and MCTS use discount ** frame_skip.
  discount: 0.997
  # EfficientZero's default SGD uses 0.2; use 0.001 when selecting Adam.
  optimizer: sgd  # sgd or adam
  learning_rate: 0.2
  momentum: 0.9  # Used only by SGD.
  weight_decay: 0.0001
  # SGD warms up, then applies the rate every `lr_decay_steps` updates.
  lr_warmup_steps: 1000
  lr_decay_steps: 100000
  # SGD uses this as its step multiplier. Adam holds LR through `steps`, then
  # linearly decays to this fraction over `final_steps`.
  lr_decay_rate: 0.1
  max_gradient_norm: 5.0
  # Shared by learner, reanalysis, self-play, and checkpoint evaluation.
  # Scalar decoding stays FP32 even when network inference uses BF16.
  precision: bf16  # fp32 or bf16
  # Only controls cuDNN determinism; TF32 and matmul precision use PyTorch defaults.
  deterministic: false
  # Disable these checks in production after validating with them enabled.
  runtime_type_checks: false
  # Compile the complete learner unroll/loss graph and autotune its kernels.
  compile_model: true
  compile_mode: default
  log_every: 50
  # auto shows tqdm only on a terminal; always also supports tee/log pipelines.
  progress_mode: auto  # auto, always, or never
  progress_interval_seconds: 0.1

# Apply independent draws to the root stack and the packed sequence of
# consistency targets, matching the released EfficientZero Atari learner.
augmentation:
  enabled: true
  transforms: [shift, intensity]
  shift_delta: 4
  intensity_scale: 0.05

# EfficientZero Atari policy, value, value-prefix, and consistency settings.
# Reward supervises an LSTM value prefix. Consistency aligns each recurrent
# dynamics state with the representation of its corresponding observation.
loss:
  policy_weight: 1.0
  # EZV2 config uses 0.5, but its Value_loss applies another 0.5 when IQL is
  # disabled. Our scalar cross-entropy has no internal half, so 0.25 is equal.
  value_weight: 0.25
  reward_weight: 1.0
  consistency_weight: 2.0
  # ROSMO positive-model-advantage behavior cloning; 0 disables it.
  behavior_regularization_weight: 0.0

checkpoint:
  path: checkpoints/${environment_slug:${environment.id}}/agent_latest.pt
  # Keep model-only checkpoints and evaluate every 10k collection updates,
  # then every 5k learner-only updates.
  collection_interval: 10000
  final_interval: 5000
  # Save replay, optimizer, targets, and RNG state immediately before the
  # learner-only phase. Set to null to disable the (roughly 3 GB) snapshot.
  pre_final_snapshot_path: null
  # Set this path to skip self-play and rerun only training.final_steps.
  resume_pre_final_path: null

evaluation:
  enabled: true
  # Evaluate the loaded update before applying final-phase learner updates.
  evaluate_on_resume: false
  episodes: 16
  num_envs: 32
  data_path: evaluations/${environment_slug:${environment.id}}/agent_evaluations.json
  plot_path: evaluations/${environment_slug:${environment.id}}/agent_evaluation.png

wandb:
  # Optional: install with `uv sync --extra wandb`, then override to true.
  enabled: false
  project: AtariAgent
  entity: null
  # Defaults to the game name. Launchers may provide a descriptive suffix.
  name: null
  tags: []

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
