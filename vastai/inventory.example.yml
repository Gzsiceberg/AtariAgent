all:
  children:
    workers:
      hosts:
        worker_example:
          ansible_host: YOUR_INSTANCE_IP
          ansible_port: 22
          instance_id: YOUR_VAST_INSTANCE_ID  # Required by queue_stop.yml
          # Operator notes; not used to decide whether to submit a stop job:
          # preparation_status: prepared
          # worker_token_expires_at: 'YYYY-MM-DDTHH:MM:SSZ'
          # stop_job_ids: [local-1]
      vars:
        ansible_user: root
        ansible_ssh_common_args: '-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
        repo_root: /workspace/AtariAgent
        repo_url: git@github.com:Gzsiceberg/AtariAgent.git
